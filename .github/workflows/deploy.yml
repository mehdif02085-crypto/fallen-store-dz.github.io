name: Deploy Fallen Store to GitHub Pages

# Runs on every push to main (i.e. every Lovable change that syncs to GitHub),
# rebuilding the site and republishing it to GitHub Pages automatically.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute base path
        run: |
          BASE="$(node scripts/github-pages.mjs base)"
          echo "GITHUB_PAGES_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Test hosting rules
        run: bun test scripts/github-pages.test.ts src/lib/site-path.test.ts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          BUILD_TARGET: github-pages
          # Public browser configuration only. Existing tracked .env values remain a fallback.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          # Blank Actions values must not mask the project's existing public .env values.
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          bun -e 'import { loadEnv } from "vite"; const e = loadEnv("production", process.cwd(), "VITE_"); for (const n of ["VITE_SUPABASE_URL", "VITE_SUPABASE_PUBLISHABLE_KEY"]) { if (!e[n]) throw new Error("Missing public build setting: " + n); } if (e.VITE_SUPABASE_PUBLISHABLE_KEY.startsWith("sb_secret_")) throw new Error("Use a publishable key, never a private key.");'
          bun run build

      - name: Prepare GitHub Pages output
        run: node scripts/github-pages.mjs prepare dist/client

      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
